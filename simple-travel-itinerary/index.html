<!--Simple Travel Itinerary Planner by Jane Oracion-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Travel Itinerary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="project-title">Simple Travel Itinerary</h1>
    <!-- Itinerary Title Input -->
    <div id="itinerary-title-container">
        <input type="text" id="title-itinerary" placeholder="Enter Itinerary Title">
    </div>

    <!-- Save as PDF & Print Button -->
    <div id="save-print-container">
        <button id="save-pdf-btn">Save as PDF</button>
        <button id="print-btn">Print Itinerary</button>
    </div>

    <!-- Calendar Grid -->
    <div class="calendar-scroll-container" role="region" aria-label="Weekly calendar. Scroll horizontally to view all days." tabindex="0">
    <div class="calendar-grid">
        <!-- Row 1: Days of the week-->
        <div class="grid-header empty-cell"></div>
        <div class="grid-header">Sunday</div>
        <div class="grid-header">Monday</div>
        <div class="grid-header">Tuesday</div>
        <div class="grid-header">Wednesday</div>
        <div class="grid-header">Thursday</div>
        <div class="grid-header">Friday</div>
        <div class="grid-header">Saturday</div> 

        <!-- Row 2: Week 1 -->
        <div class="week-label">Week 1</div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>

        <!-- Row 3: Week 2 -->
        <div class="week-label">Week 2</div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>

        <!-- Row 4: Week 3 -->
        <div class="week-label">Week 3</div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>

        <!-- Row 5: Week 4 -->
        <div class="week-label">Week 4</div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>

        <!-- Row 6: Week 5 -->
        <div class="week-label">Week 5</div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
        <div class="drop-zone"></div>
    </div>
    </div>

<!--Add Activity-->
<form id="activity-form" class="add-activity-container">
    <input type="text" id="activity-input" placeholder="Enter activity name" aria-label="Activity name" required>
    <button id="add-activity-btn" type="submit">Add Activity</button>
</form>

<h3 id="activity-title">Activities</h3>
<div class="activities-container" id="activities-container">
    <!-- Activities Container: Big Drop Zone -->
</div>

</body>
<footer>
    <p>&copy; Jane Oracion. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</html>
